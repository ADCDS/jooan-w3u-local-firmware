# SPDX-License-Identifier: GPL-2.0-only
# Checks that need no private input (no Ingenic toolchain, OEM rootfs or
# release signing key). The full gate is ci/check.sh on the maintainer host.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  hosted:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install build and test tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ffmpeg
      - name: Hosted checks
        run: ci/check-hosted.sh
