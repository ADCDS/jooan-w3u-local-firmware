# Exact target: JA-A12, T23N, CV2005/CV2005S1, OEM Linux3.10.14.
# A compatible external library and retained modules/IQ data are required.
# Native OpenIMP profile tested at these dimensions/fps with audio disabled.
# Native boot layout (what scripts/install-camera.py deploys): the release in
# the internal appfs, private config/state/TLS on JFFS2 in /opt, no SD card.
# The installer rewrites the release path below to the installed release ID.
# See docs/hardware.md for explicit ABI flags and libatomic.so.1 runtime.
backend=imp
libimp=/mnt/mtd/jooanipc-open/releases/RELEASE-ID/libimp.so
bind=0.0.0.0
http_port=18443
rtsp_port=18554
discovery=0
discovery_port=3702
username=admin
password=
realm=jooanipc-open
sensors=2
main_only=1
width=1920
height=1080
# Independent substream settings are unused with main_only=1.
sub_width=320
sub_height=240
fps=15
bitrate=3072
# Fixed lens stays at 640x360. URLs ch1/ch3 share ch0/ch2 respectively.
# main_only=0 instead requires matching mains up to 1280x720 for native IMP.
width1=640
height1=360
bitrate1=768
sub_bitrate=256
gop_frames=15
# Match the original Frigate helper's steady 350 ms nudge.
onvif_nudge=1
audio=0
recording=0
record_seconds=300
# Recordings go to RAM below and the board has about 38 MB: keep the cap small.
record_max_mb=8
state_dir=/opt/jooanipc-open/state
# No SD card: recordings, when enabled, go to RAM.
record_dir=/run/jooanipc-open/recordings
max_clients=8
allow_plain_http=0
tls_cert=/opt/jooanipc-open/cert.pem
tls_key=/opt/jooanipc-open/key.pem
# No RTC. With the retained local controller (0.2.22+), it owns network time:
# leave this empty. Otherwise an SNTP server, IPv4[:port], usually the gateway.
ntp_server=

# Both installed sensors are upside down; bit0 horizontal, bit1 vertical.
flip0=3
flip1=3
# Native boot hands the armed hardware watchdog to this daemon and refuses to
# start without both of these: the daemon feeds the watchdog and homes pan/tilt.
watchdog=1
motor_home=1
