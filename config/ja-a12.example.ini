# Exact target: JA-A12, T23N, CV2005/CV2005S1, OEM Linux3.10.14.
# A compatible external library and retained modules/IQ data are required.
# This template is not an assertion of on-device compatibility.
# Paths below require a private, writable mount; see docs/hardware.md.
# VFAT needs mount-level fmask=0177,dmask=0077, not chmod alone.
backend=imp
libimp=/mnt/sd_card/private-sdk/libimp.so
bind=0.0.0.0
http_port=8443
rtsp_port=8554
discovery=1
discovery_port=3702
username=admin
password=
realm=jooanipc-open
sensors=2
width=2304
height=1296
sub_width=640
sub_height=360
fps=15
bitrate=1024
audio=1
recording=0
record_seconds=300
record_max_mb=512
state_dir=/mnt/sd_card/jooanipc-open/state
record_dir=/mnt/sd_card/jooanipc-open/recordings
max_clients=4
allow_plain_http=0
tls_cert=/mnt/sd_card/jooanipc-open/tls/certificate.pem
tls_key=/mnt/sd_card/jooanipc-open/tls/private.key
